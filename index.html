<!DOCTYPE html>
<html lang="pt-br" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Access Leader - Pro Sync Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        /* Animação de brilho voando */
        .collect-particle {
            position: fixed;
            pointer-events: none;
            background: #40E0D0;
            border-radius: 50%;
            box-shadow: 0 0 10px #40E0D0, 0 0 20px #40E0D0;
            z-index: 9999;
            transition: all 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* Pulso de feedback no microchip superior */
        @keyframes chip-glow {
            0% { transform: scale(1); filter: drop-shadow(0 0 0px #40E0D0); }
            50% { transform: scale(1.3); filter: drop-shadow(0 0 15px #40E0D0); }
            100% { transform: scale(1); filter: drop-shadow(0 0 0px #40E0D0); }
        }

        .chip-impact {
            animation: chip-glow 0.5s ease-out;
            color: #40E0D0 !important;
        }

        /* Tooltip de Precisão (4 casas) */
        .chip-precision-overlay {
            position: absolute;
            top: 45px;
            right: 0;
            background: rgba(10, 10, 10, 0.95);
            border: 1px solid #40E0D0;
            padding: 8px 12px;
            border-radius: 12px;
            backdrop-filter: blur(10px);
            z-index: 100;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            pointer-events: none;
            opacity: 0;
            transform: translateY(-10px);
            transition: all 0.3s ease;
            min-width: 160px;
        }

        .chip-precision-overlay.active {
            opacity: 1;
            transform: translateY(0);
        }

        .chip-precision-overlay div {
            font-family: 'JetBrains Mono', 'Fira Code', monospace;
            line-height: 1.4;
        }

        /* Botão de Jogo com leve hover */
        button[onclick="openGame()"] {
            transition: all 0.2s ease;
            position: relative;
            transform: none !important;
            filter: none !important;
            border: none !important;
            box-shadow: none !important;
        }

        button[onclick="openGame()"]:hover {
            opacity: 0.8;
            transform: scale(1.05) !important;
        }

        /* BOTÃO BOOST SEM EFEITOS ESPECIAIS */
        button[onclick*="Boost"],
        button[onclick*="boost"] {
            transform: none !important;
            filter: none !important;
            border: none !important;
            box-shadow: none !important;
            transition: none !important;
        }

        /* REMOÇÃO DE VALORES REDUNDANTES NO HASHRATE */
        #hashrate-ldc-value,
        #hashrate-usd-value,
        .hashrate-extra-info {
            display: none !important;
        }

        /* Compactação do painel de Hashrate */
        .hashrate-card {
            min-height: auto !important;
            padding-top: 0.75rem !important;
            padding-bottom: 0.75rem !important;
        }

        :root { --accent: #40E0D0; }
        .dark {
            --bg: #0a0a0a; --text: #ffffff; --card: rgba(255,255,255,0.05);
            --header-bg: rgba(10, 10, 10, 0.9); --yield-bg: rgba(0,0,0,0.2);
            --yield-text: #40E0D0; --mining-num: #40E0D0; --circle-border: rgba(64, 224, 208, 0.2);
        }
        .light {
            --bg: #f3f4f6; --text: #111827; --card: #ffffff;
            --header-bg: rgba(243, 244, 246, 0.9); --yield-bg: #40E0D0;
            --yield-text: #000000; --mining-num: #000000; --circle-border: #000000;
        }
        body { background-color: var(--bg); color: var(--text); transition: all 0.3s ease; font-family: 'Inter', sans-serif; overflow-x: hidden; }
        .app-card { background: var(--card); border: 1px solid rgba(128,128,128,0.1); }
        .yield-panel { background-color: var(--yield-bg); color: var(--yield-text); }
        .mining-numbers { color: var(--mining-num); }
        .process-circle { border: 6px solid var(--circle-border); transition: all 0.3s ease; }
        #game-area { position: relative; width: 100%; height: 100%; overflow: hidden; touch-action: none; background: #000; border-radius: 20px; }
        #game-container { background-color: #0a0a0a !important; color: #ffffff !important; }
        
        .machine-slot {
            aspect-ratio: 1/1;
            background: rgba(255,255,255,0.02);
            border: 2px dashed rgba(64, 224, 208, 0.15);
            border-radius: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            transition: all 0.3s;
            min-height: 80px;
        }
        .machine-active {
            border: 2px solid #40E0D0;
            background: rgba(64, 224, 208, 0.05);
            box-shadow: 0 0 15px rgba(64, 224, 208, 0.1);
        }

        .header-content {
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 1rem;
        }

        /* --- AJUSTES EXCLUSIVOS MOBILE --- */
        @media (max-width: 1023px) {
            main {
                padding: 75px 12px 90px 12px; /* Reduzi padding lateral e superior */
            }
            .hashrate-panel {
                padding: 1.25rem !important; /* Menos padding vertical */
                border-radius: 2rem !important;
                margin-bottom: 1rem;
            }
            #display-hashrate {
                font-size: 3.2rem !important; /* Ligeiramente menor */
            }
            .yield-panel {
                padding: 0.75rem !important; /* Compactado */
            }
            #machine-grid {
                grid-template-columns: repeat(3, 1fr) !important;
                gap: 6px !important;
            }
            .sistema-seguro-container {
                margin-top: 10px !important;
                opacity: 0.25;
            }
            .sistema-seguro-container p {
                font-size: 9px !important;
            }
            .mining-rack-controls {
                flex-wrap: wrap;
                justify-content: center;
                gap: 12px !important;
            }
        }

        /* --- LAYOUT ORIGINAL PC --- */
        @media (min-width: 1024px) {
            body {
                overflow: hidden !important;
                height: 100vh !important;
                display: flex;
                flex-direction: column;
            }
            main {
                flex: 1;
                width: 100% !important;
                max-width: 1400px !important;
                margin: 0 auto !important;
                display: flex !important;
                align-items: center !important;
                justify-content: center !important;
                padding: 70px 40px 85px 40px !important;
                box-sizing: border-box;
            }
            .desktop-grid {
                display: grid;
                grid-template-columns: 380px 680px;
                gap: 2.5rem;
                align-items: center;
                justify-content: center;
                width: 100%;
                height: auto;
            }
            section { height: auto; width: 100%; }
            .hashrate-panel {
                height: auto;
                padding: 2.5rem !important;
                border-radius: 3.5rem !important;
                box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            }
            #machine-grid {
                display: grid !important;
                gap: 12px !important;
                grid-template-columns: repeat(4, 1fr) !important;
                width: 100%;
                min-height: 200px;
            }
        }
    </style>
</head>
<body class="antialiased font-sans">
    <header class="fixed top-0 w-full z-[100] border-b border-gray-500/10 backdrop-blur-md bg-[var(--header-bg)] h-[60px] flex items-center">
        <div class="header-content">
            <h1 class="font-black text-xl tracking-tighter uppercase italic">Access<span class="text-[#40E0D0] ml-1">Leader</span></h1>
            <div class="flex items-center gap-3">
                <div class="app-card px-2 py-1 rounded-lg flex items-center gap-2 border-yellow-400/30">
                    <i class="fas fa-microchip text-yellow-400 text-[10px]"></i>
                    <span id="display-leadercoin" class="text-[10px] font-black font-mono">0.00</span>
                </div>
                <button onclick="LanguageEngine.toggle()" class="text-[10px] font-black py-1.5 px-3 app-card rounded-lg hover:text-[#40E0D0] transition">
                    <i class="fas fa-language mr-1"></i> <span id="lang-label">PT</span>
                </button>
                <button onclick="window.toggleTheme()" class="w-9 h-9 app-card rounded-lg flex items-center justify-center text-[#40E0D0]">
                    <i id="theme-icon" class="fas fa-moon"></i>
                </button>
                <button onclick="window.showInfo()" class="text-yellow-400 flex items-center justify-center w-8 h-8"><i class="fas fa-circle-info text-xl"></i></button>
            </div>
        </div>
    </header>

    <main>
        <div class="desktop-grid">
            <section id="main-dashboard">
                <div class="app-card hashrate-panel text-center relative overflow-hidden p-8 rounded-[3rem]">
                    <p data-i18n="hashrate_label" class="text-[11px] opacity-40 font-black tracking-[0.4em] mb-4 uppercase">Hashrate Ativo</p>
                    <div class="flex items-center justify-center gap-2 mb-4">
                        <h2 id="display-hashrate" class="text-6xl font-black tracking-tighter mining-numbers">1.0</h2>
                        <span class="mining-numbers font-black text-xl italic">TH/s</span>
                    </div>
                    
                    <div class="yield-panel inline-flex flex-col items-center gap-1 px-8 py-4 rounded-3xl mb-4 w-full border border-white/5">
                        <div class="flex items-center gap-2">
                            <span id="display-leadercoin-main" class="text-2xl font-black text-yellow-400">0.00</span>
                            <span class="text-yellow-400 font-black text-xs italic uppercase tracking-widest">Ldc</span>
                        </div>
                        <div class="flex items-center gap-1 opacity-70">
                            <span class="text-[10px] font-bold uppercase tracking-[0.2em] text-white">Est. Value:</span>
                            <span id="display-balance" class="text-[12px] font-black text-white">$ 0.0000</span>
                        </div>
                    </div>

                    <div class="sistema-seguro-container py-2 opacity-30">
                        <i class="fas fa-shield-halved text-2xl text-[#40E0D0]"></i>
                        <p class="text-[9px] uppercase font-black tracking-widest mt-1">Sistema Seguro</p>
                    </div>
                </div>
            </section>

            <section>
                <div class="app-card p-6 lg:p-8 rounded-[3rem] overflow-hidden">
                    <div class="mb-6 flex flex-col lg:flex-row justify-between items-center lg:items-end px-2 gap-4">
                        <div class="flex flex-col gap-1 items-center lg:items-start">
                            <div class="flex items-center gap-3">
                                <b class="text-[10px] uppercase opacity-50 tracking-widest italic">Mining Rack v2.0</b>
                                <div class="flex items-center gap-2 bg-white/5 px-3 py-1 rounded-full border border-[#40E0D0]/20">
                                    <div class="w-1.5 h-1.5 bg-[#40E0D0] rounded-full animate-pulse"></div>
                                    <span id="mining-increment" class="text-[12px] font-mono font-bold text-[#40E0D0]">0.00000000</span>
                                </div>
                            </div>
                            <span class="text-[9px] opacity-30 uppercase tracking-tighter">Hardware + Storage + Shop</span>
                        </div>
                        <div class="mining-rack-controls flex gap-3 items-center">
                            <button id="btn-collect" onclick="window.GameState.collect()" class="bg-[#40E0D0] text-black font-black px-4 py-2 rounded-xl uppercase text-[10px] hover:scale-105 active:scale-95 transition-all shadow-lg shadow-[#40E0D0]/20">
                                Coletar
                            </button>
                            <button onclick="window.openVault()" class="text-[10px] text-yellow-400 font-black uppercase tracking-widest"><i class="fas fa-gem mr-1"></i> Cofre</button>
                            <button onclick="PlayMining.openShop()" class="text-[10px] text-[#40E0D0] font-black uppercase tracking-widest">Loja <i class="fas fa-plus-circle ml-1"></i></button>
                        </div>
                    </div>
                    <div id="machine-grid"></div>
                </div>
            </section>
        </div>

        <div id="vault-modal" class="hidden fixed inset-0 z-[300] bg-black/95 backdrop-blur-xl flex flex-col p-6">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-yellow-400 font-black italic uppercase">Armazenamento</h2>
                <button onclick="window.closeVault()" class="text-white opacity-50"><i class="fas fa-times"></i></button>
            </div>
            <div id="vault-items" class="grid grid-cols-2 gap-4 overflow-y-auto"></div>
        </div>

        <div id="wallet-modal" class="hidden fixed inset-0 z-[300] bg-black/95 backdrop-blur-xl flex flex-col p-6">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-[#40E0D0] font-black italic uppercase">Minha Carteira</h2>
                <button onclick="WalletSystem.toggle()" class="text-white opacity-50"><i class="fas fa-times"></i></button>
            </div>
            <div id="wallet-content" class="space-y-6"></div>
        </div>

        <div id="boost-modal" class="hidden fixed inset-0 z-[300] bg-black/95 backdrop-blur-xl flex flex-col p-6">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-orange-500 font-black italic uppercase">Aceleradores</h2>
                <button onclick="BoostSystem.toggle()" class="text-white opacity-50"><i class="fas fa-times"></i></button>
            </div>
            <div id="boost-items" class="space-y-4 overflow-y-auto"></div>
        </div>
        
        <div id="shop-modal" class="hidden fixed inset-0 z-[300] bg-black/95 backdrop-blur-xl flex flex-col p-6">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-[#40E0D0] font-black italic uppercase">Hardware Shop</h2>
                <button onclick="PlayMining.closeShop()" class="text-white opacity-50"><i class="fas fa-times"></i></button>
            </div>
            <div id="shop-items" class="flex-grow overflow-y-auto space-y-4"></div>
        </div>

        <div id="game-container" class="hidden fixed inset-0 z-[200] flex flex-col bg-[#0a0a0a]">
             <div class="flex justify-between items-center p-4 border-b border-white/10">
                <span class="text-yellow-400 font-black italic uppercase">Access Games</span>
                <button onclick="closeGame()" class="text-white opacity-50"><i class="fas fa-times"></i></button>
            </div>
            <div id="game-menu" class="flex-grow flex flex-col items-center justify-center p-6 space-y-4">
                <h1 class="text-4xl font-black text-white italic mb-4 uppercase">Selecione o <span class="text-yellow-400">Game</span></h1>
                <button onclick="selectGame('stable')" class="w-full max-w-xs bg-white/5 border border-[#40E0D0]/30 text-white font-black py-5 rounded-2xl uppercase hover:bg-[#40E0D0]/20 transition-all">Stable Coins</button>
                <button onclick="selectGame('memory')" class="w-full max-w-xs bg-white/5 border border-yellow-400/30 text-white font-black py-5 rounded-2xl uppercase hover:bg-yellow-400/20 transition-all">Neural Link</button>
                <button onclick="selectGame('pipe')" class="w-full max-w-xs bg-white/5 border border-purple-500/30 text-white font-black py-5 rounded-2xl uppercase hover:bg-purple-500/20 transition-all">Miner Impulse</button>
            </div>
            <div id="game-screen" class="hidden relative flex-grow overflow-hidden flex flex-col">
                <div id="game-hud" class="hidden flex justify-between items-center px-6 py-4 z-[210] bg-black/40">
                    <div class="bg-black/50 backdrop-blur-md px-4 py-2 rounded-xl border border-white/10">
                        <span class="text-[10px] uppercase opacity-50 mr-1">Score:</span>
                        <span id="game-score-top" class="font-bold text-yellow-400">0</span>
                    </div>
                    <div class="bg-black/50 backdrop-blur-md px-4 py-2 rounded-xl border border-white/10">
                        <span class="text-[10px] uppercase opacity-50 mr-1">Time:</span>
                        <span id="game-timer-top" class="font-bold text-[#40E0D0]">0s</span>
                    </div>
                </div>
                <div id="game-area" class="flex-grow"></div>
            </div>
        </div>
    </main>

    <nav class="fixed bottom-0 w-full bg-black/90 border-t border-white/10 flex justify-around items-center z-[150] h-[75px]">
        <button onclick="location.reload()" class="text-[#40E0D0] flex flex-col items-center gap-1"><i class="fas fa-microchip text-xl"></i><span class="text-[8px] uppercase font-black tracking-widest">Mining</span></button>
        <button onclick="BoostSystem.toggle()" class="text-[#40E0D0] flex flex-col items-center gap-1"><i class="fas fa-bolt text-xl"></i><span class="text-[8px] uppercase font-black tracking-widest">Boost</span></button>
        <button onclick="openGame()" class="relative -mt-10">
            <div class="w-14 h-14 bg-yellow-400 rounded-2xl flex items-center justify-center border-4 border-[#0a0a0a] shadow-2xl transform hover:scale-110 transition-transform">
                <i class="fas fa-gamepad text-black text-2xl"></i>
            </div>
        </button>
        <button onclick="WalletSystem.toggle()" class="text-[#40E0D0] flex flex-col items-center gap-1"><i class="fas fa-wallet text-xl"></i><span class="text-[8px] uppercase font-black tracking-widest">Wallet</span></button>
    </nav>

    <script>
        window.GameState = {
            balance: 0, miningValue: 0, hashrate: 1.0, leaderCoin: 0, ldcPrice: 0.05,
            machines: [], vault: [], maxSlots: 6, isRunning: false,
            init() {
                if(this.isRunning) return;
                setInterval(() => {
                    this.miningValue += (this.hashrate / 1000000);
                    const el = document.getElementById('mining-increment');
                    if(el) el.innerText = this.miningValue.toFixed(8);
                }, 100);
                this.isRunning = true;
            },
            collect() {
                if(this.miningValue <= 0) return;
                this.leaderCoin += this.miningValue;
                this.miningValue = 0;
                this.updateUI();
                if (window.saveUserData) window.saveUserData();
            },
            updateUI() {
                const ldcDisplay = this.leaderCoin.toFixed(2);
                const ldcEl = document.getElementById('display-leadercoin');
                const ldcMainEl = document.getElementById('display-leadercoin-main');
                if(ldcEl) ldcEl.innerText = ldcDisplay;
                if(ldcMainEl) ldcMainEl.innerText = ldcDisplay;
                
                this.balance = this.leaderCoin * this.ldcPrice;
                const balEl = document.getElementById('display-balance');
                if(balEl) balEl.innerText = "$ " + this.balance.toFixed(4);
            }
        };

        window.openVault = () => {
            document.getElementById('vault-modal').classList.remove('hidden');
            if(window.PlayMining && window.PlayMining.renderVault) window.PlayMining.renderVault();
        };
        window.closeVault = () => {
            document.getElementById('vault-modal').classList.add('hidden');
        };

        function openGame() {
            document.getElementById('game-container').classList.remove('hidden');
            if(document.getElementById('game-menu')) document.getElementById('game-menu').classList.remove('hidden');
            if(document.getElementById('game-screen')) document.getElementById('game-screen').classList.add('hidden');
        }
        function closeGame() {
            if(window.stopGameLoop) window.stopGameLoop();
            document.getElementById('game-container').classList.add('hidden');
        }
    </script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
        import { getFirestore, doc, updateDoc, getDoc } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-auth.js";
        
        const firebaseConfig = {
            apiKey: "AIzaSyCBjb4t4uMo7RnhTUnzag7ngeFKZDKoM3s",
            authDomain: "access-leader-12228.firebaseapp.com",
            projectId: "access-leader-12228",
            storageBucket: "access-leader-12228.firebasestorage.app",
            messagingSenderId: "276773205710",
            appId: "1:276773205710:web:22c0338ed0d92e1752c29f"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        window.db = db;

        signInAnonymously(auth);
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                window.currentUserUid = user.uid;
                const userDoc = await getDoc(doc(db, "usuarios", user.uid));
                if (userDoc.exists()) {
                    const data = userDoc.data();
                    window.GameState.leaderCoin = data.leaderCoin || 0;
                    window.GameState.hashrate = data.hashrate || 1.0;
                    window.GameState.machines = data.machines || [];
                    window.GameState.maxSlots = data.maxSlots || 6;
                    window.GameState.vault = data.vault || [];
                    
                    window.GameState.updateUI();
                    
                    const hashEl = document.getElementById('display-hashrate');
                    if(hashEl) hashEl.innerText = window.GameState.hashrate.toFixed(1);
                    
                    if(window.PlayMining) {
                        window.PlayMining.renderRack();
                        window.PlayMining.renderVault();
                    }
                }
                window.GameState.init();
                
                // DISPARO DO TUTORIAL APÓS CARREGAMENTO
                setTimeout(() => {
                    if(window.startTutorialIfReady) {
                        window.startTutorialIfReady();
                    } else if(window.TutorialSystem && window.TutorialSystem.checkFirstAccess) {
                        window.TutorialSystem.checkFirstAccess();
                    }
                }, 1200);
            }
        });

        window.saveUserData = async () => {
            if (window.currentUserUid && window.db) {
                try {
                    const userRef = doc(window.db, "usuarios", window.currentUserUid);
                    await updateDoc(userRef, {
                        balance: window.GameState.balance,
                        hashrate: window.GameState.hashrate,
                        leaderCoin: window.GameState.leaderCoin,
                        machines: window.GameState.machines,
                        maxSlots: window.GameState.maxSlots || 6,
                        vault: window.GameState.vault || [],
                        lastUpdate: new Date()
                    });
                } catch (e) { console.error("Erro ao sincronizar:", e); }
            }
        };
    </script>

    <script src="render.js"></script>
    <script src="game.js"></script>
    <script type="module">
        import { renderMiningRack } from './rack_mineracao/miningRender.js';
        window.renderMiningRack = renderMiningRack;
    </script>
    <script src="boost.js"></script>
    <script src="wallet.js"></script>
    <script src="ui.js"></script>
    <script src="lang.js"></script>
    <script src="rack_mineracao/playmining.js"></script>
    <script src="tutorial.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if(window.PlayMining && window.PlayMining.renderRack) {
                window.PlayMining.renderRack();
            }
        });
    </script>
</body>
</html>
